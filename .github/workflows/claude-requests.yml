# Used by Claude to read the dashboard's 🤖 Claude requests and to write progress back.
name: Claude requests

on:
  workflow_dispatch:
    inputs:
      action:
        description: list, update, sessions, groups, rename, addmember, checkmember, admins, status, send or greet
        required: true
        default: list
      id:
        description: Request id (update only)
        required: false
      status:
        description: asked | working | done | failed (update only)
        required: false
      reply:
        description: Note shown on the request card (update only)
        required: false
      sessions:
        description: JSON list of conversations [{"id","title"}] (sessions only)
        required: false
      group:
        description: Current group name, exactly (rename); JSON list of names (addmember, checkmember, admins, send)
        required: false
      name:
        description: New group name (rename); public image URL (send, optional)
        required: false
      phone:
        description: Number with country code (addmember, checkmember)
        required: false
      pause:
        description: Seconds between groups (addmember 8-120, default 8; send 10-120, default 20, or seconds/batch/break)
        required: false
      text:
        description: Message text (send only)
        required: false

# Long send runs wait for each other (never two sends at once); every other run goes straight ahead.
concurrency:
  group: ${{ inputs.action == 'send' && 'claude-send' || format('run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  requests:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WASENDER_API_KEY: ${{ secrets.WASENDER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g wrangler@4
      - name: Point wrangler at the database
        run: |
          id=$(wrangler d1 list --json | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const db = JSON.parse(s).find(x => x.name === "xp_wa_inbox");
              console.log(db ? (db.uuid || db.id || db.database_id || "") : "");
            });')
          test -n "$id" || { echo "::error::Database xp_wa_inbox not found"; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/$id/" wrangler.toml
      - name: Requests
        env:
          ACTION: ${{ inputs.action }}
          ID: ${{ inputs.id }}
          STATUS: ${{ inputs.status }}
          REPLY: ${{ inputs.reply }}
          SESSIONS: ${{ inputs.sessions }}
          GROUP: ${{ inputs.group }}
          NAME: ${{ inputs.name }}
          PHONE: ${{ inputs.phone }}
          PAUSE: ${{ inputs.pause }}
          TEXT: ${{ inputs.text }}
        run: node scripts/requests.mjs
